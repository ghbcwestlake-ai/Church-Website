<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F7F1E4" />
  <title>Good Hope Kids</title>
  <link rel="apple-touch-icon" href="/kids/icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet" />

  <!-- This page is deliberately self-contained and public: it is the only
       thing an unsigned-in visitor can reach under /kids, and it has to be
       reachable or nobody could ever sign in. It holds no lesson content, no
       photographs and no codes. The code it collects is checked at the edge
       by netlify/edge-functions/kids-auth.js, never here. -->
  <style>
    :root {
      --navy: #174276;
      --navy-deep: #0E2D52;
      --gold: #C7962F;
      --paper: #F7F1E4;
      --tint: #DCE4EE;
      --ink: #2E3A4A;
      --muted: #5A6472;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Nunito", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: max(40px, env(safe-area-inset-top)) 28px max(32px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .crest { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .crest img { width: 92px; height: 92px; object-fit: contain; }
    h1 {
      margin: 0;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: clamp(28px, 8vw, 34px);
      letter-spacing: -0.4px;
      color: var(--navy);
    }
    .rule { width: 54px; height: 3px; background: var(--gold); }
    .sub { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
    .spacer { flex: 1 1 auto; min-height: 24px; }

    .doors { display: flex; flex-direction: column; gap: 16px; }
    .door {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 24px 22px;
      border-radius: 18px; border: 2px solid var(--tint);
      background: var(--white); color: inherit;
      font: inherit; text-align: left; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .door:hover, .door:focus-visible { border-color: var(--gold); outline: none; }
    .door--dark { background: var(--navy); border-color: var(--navy); }
    .door .badge {
      display: flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 14px;
      background: var(--paper); flex: none;
    }
    .door--dark .badge { background: rgba(255, 255, 255, 0.12); }
    .door .label { flex: 1 1 auto; }
    .door .name {
      display: block; font-family: "Fredoka", sans-serif;
      font-weight: 600; font-size: 25px; color: var(--navy);
    }
    .door--dark .name { color: var(--white); }
    .door .hint { display: block; margin-top: 3px; font-size: 14px; line-height: 1.45; color: var(--muted); }
    .door--dark .hint { color: #C6D4E6; }

    .foot { margin: 26px 0 0; font-size: 12.5px; line-height: 1.6; color: #7A8492; text-align: center; }

    /* ---- keypad ---- */
    .back {
      align-self: flex-start;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 0; border: 0; background: none;
      font: inherit; font-size: 15px; font-weight: 700; color: var(--navy); cursor: pointer;
    }
    .who { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 14px; text-align: center; }
    .who img { width: 58px; height: 58px; object-fit: contain; }
    .who h2 { margin: 4px 0 0; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 27px; color: var(--navy); }
    .who p { margin: 0; font-size: 15px; color: var(--muted); }

    .dots { display: flex; justify-content: center; gap: 16px; margin: 30px 0 6px; }
    .dot { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--navy); }
    .dot.on { background: var(--navy); }
    .dots.wrong { animation: shake 0.4s; }
    .dots.wrong .dot { border-color: #C1272D; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }
    @media (prefers-reduced-motion: reduce) { .dots.wrong { animation: none; } }

    .msg { min-height: 22px; margin: 6px 0 0; font-size: 14px; font-weight: 600; color: #C1272D; text-align: center; }

    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .pad button {
      height: 72px; border-radius: 18px; border: 2px solid var(--tint);
      background: var(--white); cursor: pointer;
      font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 30px; color: var(--navy);
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .pad button:active { background: var(--tint); }
    .pad .ghost { border-color: transparent; background: transparent; }
    .pad .go { border-color: var(--navy); background: var(--navy); }
    .pad .go[disabled] { opacity: 0.45; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Step one: which door -->
    <section id="doors">
      <div class="crest">
        <img src="/kids/public/logo.png" alt="Good Hope Missionary Baptist Church" />
        <h1>Good Hope Kids</h1>
        <div class="rule"></div>
        <p class="sub">Children&rsquo;s Ministry<br />Westlake, Louisiana</p>
      </div>

      <div class="spacer"></div>

      <div class="doors">
        <button class="door" type="button" data-door="Parents" data-hint="Ask any children&rsquo;s ministry teacher for the parent code.">
          <span class="badge" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#174276" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20a7 7 0 0 1 14 0"/><circle cx="10" cy="8" r="4"/><path d="M17.5 13.5a5 5 0 0 1 3.5 4.8"/><circle cx="18" cy="8.5" r="2.6"/></svg>
          </span>
          <span class="label">
            <span class="name">Parents</span>
            <span class="hint">This week&rsquo;s lesson, photos and updates</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C7962F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>

        <button class="door door--dark" type="button" data-door="Teachers" data-hint="Your own code &mdash; it signs what you post.">
          <span class="badge" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 21h7"/><path d="M12 17v4"/></svg>
          </span>
          <span class="label">
            <span class="name">Teachers</span>
            <span class="hint">Present, print and plan the lesson</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C7962F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </div>

      <p class="foot">Good Hope Missionary Baptist Church<br />821 Sampson St. &middot; Westlake, LA</p>
    </section>

    <!-- Step two: the code -->
    <section id="pad" class="hidden">
      <button class="back" type="button" id="back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#174276" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        Back
      </button>

      <div class="who">
        <img src="/kids/public/logo.png" alt="" />
        <h2 id="door-name">Parents</h2>
        <p>Enter your 4-digit code</p>
      </div>

      <div class="dots" id="dots" role="status" aria-live="polite" aria-label="Code entry">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <p class="msg" id="msg"></p>

      <div class="spacer"></div>

      <div class="pad" id="keys">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" class="ghost" data-key="del" aria-label="Delete">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9.5L3 12l6.5 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"/><path d="m18 9-5 6"/><path d="m13 9 5 6"/></svg>
        </button>
        <button type="button" data-key="0">0</button>
        <button type="button" class="go" data-key="go" id="go" aria-label="Enter" disabled>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C7962F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>

      <p class="foot" id="pad-hint">Ask any children&rsquo;s ministry teacher for the parent code.</p>
    </section>

  </div>

  <script>
  (function () {
    "use strict";

    var doors = document.getElementById("doors");
    var pad = document.getElementById("pad");
    var dots = document.getElementById("dots");
    var msg = document.getElementById("msg");
    var go = document.getElementById("go");
    var entry = "";
    var busy = false;

    function paint() {
      var marks = dots.querySelectorAll(".dot");
      for (var i = 0; i < marks.length; i++) {
        marks[i].classList.toggle("on", i < entry.length);
      }
      go.disabled = entry.length !== 4 || busy;
    }

    function showDoor(name, hint) {
      document.getElementById("door-name").textContent = name;
      document.getElementById("pad-hint").innerHTML = hint;
      doors.classList.add("hidden");
      pad.classList.remove("hidden");
      entry = "";
      msg.textContent = "";
      paint();
    }

    Array.prototype.forEach.call(document.querySelectorAll(".door"), function (button) {
      button.addEventListener("click", function () {
        showDoor(button.getAttribute("data-door"), button.getAttribute("data-hint"));
      });
    });

    document.getElementById("back").addEventListener("click", function () {
      pad.classList.add("hidden");
      doors.classList.remove("hidden");
    });

    function reject(text) {
      msg.textContent = text;
      dots.classList.add("wrong");
      setTimeout(function () {
        dots.classList.remove("wrong");
        entry = "";
        paint();
      }, 450);
    }

    /* The code is never checked here. It goes to the edge function, which is
       the only thing that can mint a session. A wrong code and a right code
       look identical until the server answers. */
    function submit() {
      if (entry.length !== 4 || busy) return;
      busy = true;
      paint();
      fetch("/kids/__auth", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ code: entry })
      }).then(function (response) {
        busy = false;
        if (response.ok) {
          // Reload rather than navigate: whatever page they were originally
          // asking for is the one they get.
          window.location.reload();
          return;
        }
        if (response.status === 503) {
          reject("Not set up yet. Tell Dorian.");
          return;
        }
        reject("That code did not work.");
      }).catch(function () {
        busy = false;
        reject("No connection. Try again.");
      });
    }

    document.getElementById("keys").addEventListener("click", function (event) {
      var button = event.target.closest("button[data-key]");
      if (!button) return;
      var key = button.getAttribute("data-key");
      if (key === "del") { entry = entry.slice(0, -1); msg.textContent = ""; }
      else if (key === "go") { submit(); return; }
      else if (entry.length < 4) { entry += key; msg.textContent = ""; }
      paint();
      if (entry.length === 4) submit();
    });

    // A hardware keyboard works too, for a laptop.
    document.addEventListener("keydown", function (event) {
      if (pad.classList.contains("hidden")) return;
      if (event.key >= "0" && event.key <= "9" && entry.length < 4) {
        entry += event.key;
        msg.textContent = "";
        paint();
        if (entry.length === 4) submit();
      } else if (event.key === "Backspace") {
        entry = entry.slice(0, -1);
        paint();
      } else if (event.key === "Enter") {
        submit();
      }
    });

    paint();
  })();
  </script>
</body>
</html>
