# Netlify configuration for the Good Hope Missionary Baptist Church website.
# This is a static site (plain HTML/CSS/JS) with no build step.

[build]
  # Nothing to build. Publish the repository root as-is.
  publish = "."
  command = ""

# Send the bare domain and the www subdomain to one canonical host.
# (Netlify also handles this in the dashboard once a custom domain is added.)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Internal notes. They live in the repo on purpose, but Netlify publishes the
# repo root, which would otherwise put the board overview and the punch list at
# a guessable public URL. They are not part of the website.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# --------------------------------------------------------------------------
# CHILDREN'S MINISTRY (/kids)
#
# Everything under /kids is behind a code. The gate is an edge function
# because a check in the page would leave the lesson files, the art and the
# photographs of children fetchable by direct URL. See
# netlify/edge-functions/kids-auth.js, which also lists the two environment
# variables it needs. The public church site above is untouched by any of it.
# --------------------------------------------------------------------------

[[edge_functions]]
  path = "/kids/*"
  function = "kids-auth"

[[headers]]
  for = "/kids/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
